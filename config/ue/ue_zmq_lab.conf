#####################################################################
# srsUE - configuracion para el laboratorio TFG
# Basado en srsue/ue.conf.example del propio repositorio srsRAN_4G,
# adaptado para 5G SA + radio virtual ZMQ + nuestro Core Open5GS.
#####################################################################

[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1
device_name = zmq
# tx_port: este UE escucha aqui para ENVIAR (UL) hacia la DU
# rx_port: este UE se conecta aqui para RECIBIR (DL) desde la DU
device_args = tx_port=tcp://10.0.0.30:2001,rx_port=tcp://10.0.0.24:2000,base_srate=23.04e6

[rat.eutra]
# Portadora LTE desactivada (nof_carriers=0): fuerza modo 5G SA puro,
# sin ancla 4G. dl_earfcn queda sin uso funcional pero el parser lo
# requiere presente (valor tal cual documentado en el tutorial oficial).
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
# 20 MHz de ancho de banda -> 106 PRB (coincide con la celda de la DU)
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = mac,nas
mac_filename = /tmp/ue_mac.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = warning
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
# Mismas credenciales que el suscriptor dado de alta en Open5GS
# (bloque Core 5G, subscriber-test.md)
opc  = E8ED289DEBA952E4283B54E88E6183CA
k    = 465B5CE8B199B49FAA5F0A2EE238A6BC
imsi = 999700000000001
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
# OJO: debe coincidir EXACTAMENTE con el DNN del suscriptor en Open5GS
# (subscriber-test.md dice "internet", no "srsapn" del ejemplo original)
apn = internet
apn_protocol = ipv4

[gw]
# Sin netns: el propio contenedor Docker ya aisla la red; no hace falta
# crear un network namespace adicional como en el tutorial original
# (pensado para ejecucion directa sobre el host, no en Docker).
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
