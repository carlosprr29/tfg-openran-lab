#####################################################################
# srsUE 3 - laboratorio TFG, escenario MULTI-UE
#
# Diferencias respecto al escenario de un solo terminal:
#   - No habla con la DU directamente, sino con el broker (10.0.0.35).
#     Ver config/ocudu/NOTAS-MULTIUE.md
#   - Ancho de banda 10 MHz (52 PRB) en vez de 20 MHz (106 PRB),
#     para aligerar la carga de CPU con tres terminales.
#   - Cada terminal tiene su IMSI, sus puertos y sus ficheros propios.
#
# Basado en srsue/ue.conf.example del repositorio srsRAN_4G.
#####################################################################

[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 11.52e6
nof_antennas = 1
device_name = zmq
# tx_port: este UE escucha aqui; el broker se conecta para leer su UL
# rx_port: este UE se conecta al broker para recibir su DL
device_args = tx_port=tcp://10.0.0.32:2301,rx_port=tcp://10.0.0.35:2300,base_srate=11.52e6

[rat.eutra]
# Portadora LTE desactivada (nof_carriers=0): fuerza modo 5G SA puro,
# sin ancla 4G. dl_earfcn queda sin uso funcional pero el parser lo
# requiere presente.
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
# 10 MHz de ancho de banda -> 52 PRB (coincide con la celda de la DU)
max_nof_prb = 52
nof_prb = 52

[pcap]
enable = mac,nas
mac_filename = /tmp/ue3_mac.pcap
nas_filename = /tmp/ue3_nas.pcap

[log]
all_level = warning
filename = /tmp/ue3.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
# Credenciales del suscriptor 999700000000003 dado de alta en Open5GS.
# K y OPc son iguales en los tres terminales; solo cambia el IMSI.
opc  = E8ED289DEBA952E4283B54E88E6183CA
k    = 465B5CE8B199B49FAA5F0A2EE238A6BC
imsi = 999700000000003
imei = 353490069873321

[rrc]
release = 15
ue_category = 4

[nas]
# Debe coincidir EXACTAMENTE con el DNN del suscriptor en Open5GS
apn = internet
apn_protocol = ipv4

[gw]
# Sin netns: cada terminal corre en su propio contenedor, que ya aisla
# la red. El tutorial original usa netns porque ejecuta todo en el host.
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
