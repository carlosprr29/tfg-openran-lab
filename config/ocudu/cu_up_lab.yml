cu_up:
  plmn_list:
    - "99970"
  e1ap:
    gateways:
      - bind_addrs: 10.0.0.23
        addrs: 10.0.0.22
  # N3 hacia el UPF de Open5GS - en el ejemplo original se queda en 127.0.0.1,
  # aqui lo apuntamos a nuestra propia IP para que el UPF (10.0.0.19) pueda
  # alcanzarlo.
  ngu:
    socket:
      - bind_addr: 10.0.0.23
  f1u:
    socket:
      - bind_addr: 172.20.0.2

log:
  filename: /tmp/cu_up.log
  all_level: warning

pcap:
  e1ap_enable: true
  e1ap_filename: /tmp/cu_up_e1ap.pcap
  f1u_enable: true
  f1u_filename: /tmp/cu_up_f1u.pcap
  n3_enable: true
  n3_filename: /tmp/cu_up_n3.pcap

