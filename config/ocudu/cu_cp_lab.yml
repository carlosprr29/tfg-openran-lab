cu_cp:
  amf:
    addrs: 10.0.0.18
    bind_addrs: 10.0.0.22
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "99970"
            tai_slice_support_list:
              - sst: 1
  inactivity_timer: 7200
  e1ap:
    bind_addrs: 10.0.0.22
  f1ap:
    bind_addrs: 10.0.0.22

# Agente E2 hacia el Near-RT RIC (O-RAN SC, red 10.0.2.0/24)
e2:
  enable_cu_cp_e2: true
  addr: 10.0.2.10        # e2term del RIC
  port: 36421
  bind_addr: 10.0.2.30   # IP propia de la CU-CP en la red del RIC
  e2sm_kpm_enabled: true

log:
  filename: /tmp/cu_cp.log
  all_level: warning

# Capturas para trazas / observabilidad (bloque "Trazas / PCAPs" del diagrama)
pcap:
  ngap_enable: true
  ngap_filename: /tmp/cu_cp_ngap.pcap
  f1ap_enable: true
  f1ap_filename: /tmp/cu_cp_f1ap.pcap
  e1ap_enable: true
  e1ap_filename: /tmp/cu_cp_e1ap.pcap
