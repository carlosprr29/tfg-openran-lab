# DU para el escenario MULTI-UE (experimental).
#
# Diferencias respecto a du_zmq_lab.yml (escenario base de un terminal):
#   - 10 MHz en vez de 20 (srate 11.52 en vez de 23.04), para aligerar CPU
#     con varios terminales. Alineado con el ejemplo oficial de srsRAN.
#   - rx_port apunta al BROKER (10.0.0.35), no a un terminal concreto.
#   - PRACH ampliado para que varios terminales no colisionen al acceder.
#   - Sin coreset0_index: con 10 MHz el valor 12 no es valido y la DU aborta
#     ("Unable to derive a valid SSB pointA and k_SSB"). Se deja que el
#     software lo derive, que es lo que hace cuando no se declara.
#
# Se usa mediante el fichero de superposicion docker-compose.multiue.yml.

f1ap:
  addrs: 10.0.0.22       # CU-CP
  bind_addrs: 10.0.0.24  # esta DU

f1u:
  socket:
    - bind_addr: 172.20.0.3

# Agente E2 hacia el Near-RT RIC. Se mantiene declarado, pero durante la
# depuracion del camino ZMQ el RIC puede no estar levantado: el agente
# reintentara en segundo plano sin afectar al enlace de radio.
e2:
  enable_du_e2: true
  addr: 10.0.2.10
  port: 36421
  bind_addr: 10.0.2.31
  e2sm_kpm_enabled: true

metrics:
  layers:
    enable_sched: true
    enable_sched_ue: true
    enable_rlc: true
  periodicity:
    du_report_period: 1000

ru_sdr:
  device_driver: zmq
  # tx_port: la DU escucha aqui; el broker se conecta para leer la bajada
  # rx_port: la DU se conecta al broker para recibir la subida agregada
  device_args: tx_port=tcp://10.0.0.24:2000,rx_port=tcp://10.0.0.35:2001,base_srate=23.04e6
  srate: 23.04
  # tx_gain / rx_gain: no validos con ZMQ (el validador exige <= 0.0 dB)

cell_cfg:
  pci: 1
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "99970"
  tac: 1
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
  prach:
    prach_config_index: 1
    total_nof_ra_preambles: 64
    nof_ssb_per_ro: 1
    nof_cb_preambles_per_ssb: 64
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: /tmp/du.log
  all_level: info

pcap:
  mac_enable: enable
  mac_filename: /tmp/du_mac.pcap
