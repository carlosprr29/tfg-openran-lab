logger:
  file:
    path: /var/log/open5gs/smf.log

global:
  max:
    ue: 1024

smf:
  sbi:
    server:
      - address: 10.0.0.20
        port: 7777
    client:
      nrf:
        - uri: http://10.0.0.11:7777
  pfcp:
    server:
      - address: 10.0.0.20
    client:
      upf:
        - address: 10.0.0.19
          dnn:
            - internet
  gtpc:
    server:
      - address: 10.0.0.20
  gtpu:
    server:
      - address: 10.0.0.20
  metrics:
    server:
      - address: 10.0.0.20
        port: 9090
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
      dnn: internet
  dns:
    - 8.8.8.8
    - 8.8.4.4
  mtu: 1400
  freeDiameter: /etc/freeDiameter/smf.conf
