# srsUE 2 - ejecucion NATIVA en el anfitrion (no en contenedor)
# Todo por localhost, como en el tutorial oficial de srsRAN.
# La interfaz de datos va en su propio netns para que los tres no choquen.

[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 11.52e6
nof_antennas = 1
device_name = zmq
device_args = tx_port=tcp://127.0.0.1:2201,rx_port=tcp://127.0.0.1:2200,base_srate=11.52e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 52
nof_prb = 52

[pcap]
enable = mac,nas
mac_filename = /tmp/ue2_mac.pcap
nas_filename = /tmp/ue2_nas.pcap

[log]
all_level = info
filename = /tmp/ue2.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = E8ED289DEBA952E4283B54E88E6183CA
k    = 465B5CE8B199B49FAA5F0A2EE238A6BC
imsi = 999700000000002
imei = 353490069873320

[rrc]
release = 15
ue_category = 4

[nas]
apn = internet
apn_protocol = ipv4

[gw]
netns = ue2
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
