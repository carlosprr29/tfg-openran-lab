name: tfg-openran-lab

# =============================================================================
# Laboratorio 5G Open RAN
# -----------------------------------------------------------------------------
# Este fichero define los 16 contenedores propios del laboratorio (bloques 1-3).
# El Near-RT RIC (bloque 4) es un despliegue aparte, en ./oran-sc-ric, con su
# propio docker-compose.yml. Ambos se comunican a traves de la red ric_net,
# declarada aqui como externa (ver al final del fichero).
#
# Arranque recomendado: ./start-lab.sh  (respeta el orden y verifica cada paso)
#
# -----------------------------------------------------------------------------
# Direccionamiento
# -----------------------------------------------------------------------------
# Red oran_5g_net (10.0.0.0/24) - red principal del laboratorio
#   10.0.0.10        MongoDB
#   10.0.0.11 - .20  Core 5G (Open5GS, un contenedor por Network Function)
#   10.0.0.21        Open5GS WebUI
#   10.0.0.22        OCUDU CU-CP
#   10.0.0.23        OCUDU CU-UP
#   10.0.0.24        OCUDU DU
#   10.0.0.30        UE simulado (srsUE)
#
# Red f1u_net (172.20.0.0/24) - solo trafico F1-U entre CU-UP y DU
#   172.20.0.2       OCUDU CU-UP
#   172.20.0.3       OCUDU DU
#
# Red ric_net (10.0.2.0/24) - externa, la crea el compose de oran-sc-ric
#   10.0.2.30        OCUDU CU-CP (agente E2)
#   10.0.2.31        OCUDU DU (agente E2)
#
# Subred de terminales: 10.45.0.0/16, con puerta de enlace 10.45.0.1 en la
# interfaz ogstun del UPF.
# =============================================================================

services:
  # ===========================================================================
  # BLOQUE 1: CORE 5G (Open5GS)
  # Un contenedor por Network Function, mas MongoDB y la interfaz web.
  # Imagen: docker build -t local/open5gs:latest -f Dockerfile.open5gs .
  # ===========================================================================
  mongodb:
    image: mongo:7.0
    container_name: core-mongodb
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.10
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 3s
      retries: 5

  open5gs-nrf:
    image: local/open5gs:latest
    container_name: core-nrf
    command: open5gs-nrfd -c /etc/open5gs/nrf.yaml
    volumes:
      - ./config/open5gs/nrf.yaml:/etc/open5gs/nrf.yaml:ro
      - ./logs/open5gs:/var/log/open5gs
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.11
    healthcheck:
      test: ["CMD", "sh", "-c", "ss -tln | grep -q :7777"]
      interval: 5s
      timeout: 3s
      retries: 5

  open5gs-ausf:
    image: local/open5gs:latest
    container_name: core-ausf
    command: open5gs-ausfd -c /etc/open5gs/ausf.yaml
    volumes:
      - ./config/open5gs/ausf.yaml:/etc/open5gs/ausf.yaml:ro
      - ./logs/open5gs:/var/log/open5gs
    depends_on:
      open5gs-nrf:
        condition: service_healthy
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.12

  open5gs-udm:
    image: local/open5gs:latest
    container_name: core-udm
    command: open5gs-udmd -c /etc/open5gs/udm.yaml
    volumes:
      - ./config/open5gs/udm.yaml:/etc/open5gs/udm.yaml:ro
      - ./logs/open5gs:/var/log/open5gs
    depends_on:
      open5gs-nrf:
        condition: service_healthy
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.13

  open5gs-udr:
    image: local/open5gs:latest
    container_name: core-udr
    command: open5gs-udrd -c /etc/open5gs/udr.yaml
    volumes:
      - ./config/open5gs/udr.yaml:/etc/open5gs/udr.yaml:ro
      - ./logs/open5gs:/var/log/open5gs
    depends_on:
      open5gs-nrf:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.14

  open5gs-pcf:
    image: local/open5gs:latest
    container_name: core-pcf
    command: open5gs-pcfd -c /etc/open5gs/pcf.yaml
    volumes:
      - ./config/open5gs/pcf.yaml:/etc/open5gs/pcf.yaml:ro
      - ./logs/open5gs:/var/log/open5gs
    depends_on:
      open5gs-nrf:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.15

  open5gs-bsf:
    image: local/open5gs:latest
    container_name: core-bsf
    command: open5gs-bsfd -c /etc/open5gs/bsf.yaml
    volumes:
      - ./config/open5gs/bsf.yaml:/etc/open5gs/bsf.yaml:ro
      - ./logs/open5gs:/var/log/open5gs
    depends_on:
      open5gs-nrf:
        condition: service_healthy
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.16

  open5gs-nssf:
    image: local/open5gs:latest
    container_name: core-nssf
    command: open5gs-nssfd -c /etc/open5gs/nssf.yaml
    volumes:
      - ./config/open5gs/nssf.yaml:/etc/open5gs/nssf.yaml:ro
      - ./logs/open5gs:/var/log/open5gs
    depends_on:
      open5gs-nrf:
        condition: service_healthy
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.17

  open5gs-amf:
    image: local/open5gs:latest
    container_name: core-amf
    command: open5gs-amfd -c /etc/open5gs/amf.yaml
    volumes:
      - ./config/open5gs/amf.yaml:/etc/open5gs/amf.yaml:ro
      - ./logs/open5gs:/var/log/open5gs
    depends_on:
      open5gs-ausf:
        condition: service_started
      open5gs-udm:
        condition: service_started
      open5gs-nssf:
        condition: service_started
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.18
    healthcheck:
      test: ["CMD", "sh", "-c", "ss -tln | grep -q :7777"]
      interval: 5s
      timeout: 3s
      retries: 5

  # El UPF necesita la interfaz ogstun activa para entregar el trafico de los
  # terminales. open5gs-upfd crea el dispositivo pero no lo levanta ni le
  # asigna IP (es un paso manual en la documentacion oficial), asi que se hace
  # aqui en paralelo al arranque del demonio.
  open5gs-upf:
    image: local/open5gs:latest
    container_name: core-upf
    command: >
      sh -c '(while ! ip link show ogstun >/dev/null 2>&1; do sleep 0.2; done;
      ip addr add 10.45.0.1/16 dev ogstun;
      ip link set ogstun up) &
      exec open5gs-upfd -c /etc/open5gs/upf.yaml'
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config/open5gs/upf.yaml:/etc/open5gs/upf.yaml:ro
      - ./logs/open5gs:/var/log/open5gs
    depends_on:
      open5gs-nrf:
        condition: service_healthy
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.19

  open5gs-smf:
    image: local/open5gs:latest
    container_name: core-smf
    command: open5gs-smfd -c /etc/open5gs/smf.yaml
    volumes:
      - ./config/open5gs/smf.yaml:/etc/open5gs/smf.yaml:ro
      - ./logs/open5gs:/var/log/open5gs
    depends_on:
      open5gs-pcf:
        condition: service_started
      open5gs-upf:
        condition: service_started
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.20
    healthcheck:
      test: ["CMD", "sh", "-c", "ss -tln | grep -q :7777"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Interfaz web para dar de alta suscriptores, en localhost:9999.
  # Usuario admin / contrasena 1423. Si el login falla, ver config/ric/NOTAS-RIC.md:
  # la cuenta por defecto no siempre se crea sola.
  open5gs-webui:
    image: gradiant/open5gs-webui:2.7.5
    container_name: core-webui
    environment:
      - DB_URI=mongodb://10.0.0.10/open5gs
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "9999:9999"
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.21

  # ===========================================================================
  # BLOQUE 2: RED DE ACCESO RADIO (OCUDU)
  # Split completo: CU-CP (control), CU-UP (datos) y DU (capas bajas).
  # Radio virtual por ZMQ, sin hardware de radiofrecuencia.
  #
  # Imagen (construir antes del primer arranque, tarda bastante):
  #   docker build -t ocudu/gnb -f ocudu/docker/Dockerfile ocudu \
  #     --build-arg EXTRA_CMAKE_ARGS="-DENABLE_ZEROMQ=ON -DENABLE_EXPORT=ON" \
  #     --build-arg NUM_JOBS=2
  #
  # Los tres binarios llevan capacidades Linux grabadas (setcap): sin cap_add
  # el kernel rechaza ejecutarlos con "operation not permitted".
  # ===========================================================================
  ocudu-cu-cp:
    image: ocudu/gnb
    container_name: ran-cu-cp
    cap_add:
      - SYS_NICE
      - IPC_LOCK
      - PERFMON
    volumes:
      - ./config/ocudu/cu_cp_lab.yml:/cu_cp_config.yml:ro
      - ./logs/ran/cu_cp:/tmp
    depends_on:
      open5gs-amf:
        condition: service_healthy
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.22
      ric_net:
        ipv4_address: 10.0.2.30
    # Comprueba que los puertos SCTP de E1 (38462) y F1-C (38472) escuchan.
    # El $$p escapa la variable de shell para que Compose no la interpole.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'for p in 38462 38472; do ss -l -H -A sctp "sport = :$$p" | grep -q . || exit 1; done; exit 0',
        ]
      interval: 3s
      timeout: 1s
      retries: 60
    command: ocucp -c /cu_cp_config.yml

  ocudu-cu-up:
    image: ocudu/gnb
    container_name: ran-cu-up
    cap_add:
      - SYS_NICE
      - IPC_LOCK
      - PERFMON
    volumes:
      - ./config/ocudu/cu_up_lab.yml:/cu_up_config.yml:ro
      - ./logs/ran/cu_up:/tmp
    depends_on:
      ocudu-cu-cp:
        condition: service_healthy
      open5gs-upf:
        condition: service_started
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.23
      f1u_net:
        ipv4_address: 172.20.0.2
    command: ocuup -c /cu_up_config.yml

  ocudu-du:
    image: ocudu/gnb
    container_name: ran-du
    cap_add:
      - SYS_NICE
      - IPC_LOCK
      - PERFMON
    volumes:
      - ./config/ocudu/du_zmq_lab.yml:/du_config.yml:ro
      - ./logs/ran/du:/tmp
    depends_on:
      ocudu-cu-cp:
        condition: service_healthy
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.24
      f1u_net:
        ipv4_address: 172.20.0.3
      ric_net:
        ipv4_address: 10.0.2.31
    command: odu -c /du_config.yml

  # ===========================================================================
  # BROKER ZMQ MULTI-UE
  # La DU tiene un solo par de puertos ZMQ, asi que no puede hablar con varios
  # terminales a la vez. El broker reparte la senal de bajada a cada UE y
  # agrega las de subida. Ver config/ocudu/NOTAS-MULTIUE.md
  #
  # Imagen: docker build -t local/ue-broker:latest broker/
  #
  # ORDEN DE ARRANQUE: el broker va el ULTIMO, despues de los terminales.
  # No se declara con depends_on a proposito: el orden lo controla
  # start-lab.sh, donde esta toda la logica de arranque y verificacion.
  # Los terminales no conectaran hasta que el broker este en marcha.
  #
  # UE_GAINS: atenuacion por terminal (1.0 = senal intacta). Es el equivalente
  # a los deslizadores de la version grafica del broker oficial.
  # ===========================================================================
  ue-broker:
    image: local/ue-broker:latest
    container_name: ue-broker
    shm_size: '2gb'
    environment:
      - PYTHONUNBUFFERED=1
      - DU_ADDR=10.0.0.24
      - DU_TX_PORT=2000
      - DU_RX_PORT=2001
      - UE_ADDRS=10.0.0.30,10.0.0.31,10.0.0.32
      - UE_TX_PORTS=2101,2201,2301
      - UE_RX_PORTS=2100,2200,2300
      - UE_GAINS=1.0,1.0,1.0
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.35

  # ===========================================================================
  # BLOQUE 3: TERMINALES EMULADOS (srsUE)
  # Tres terminales independientes, cada uno con su IMSI, sus puertos ZMQ y sus
  # ficheros de log y captura propios. Todos hablan con el broker, no con la DU.
  #
  # Se eligen al arrancar:
  #   ./start-lab.sh --ues 1     solo ue1
  #   ./start-lab.sh --ues 2     ue1 y ue2
  #   ./start-lab.sh             los tres (por defecto)
  #
  # Imagen: docker build -t local/srsue:latest srsRAN_4G
  # ===========================================================================
  ue1:
    image: local/srsue:latest
    container_name: ue-srsue1
    # NET_ADMIN y /dev/net/tun: el terminal crea la interfaz tun_srsue al
    # establecer la sesion de datos.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config/ue/ue1.conf:/config/ue.conf:ro
      - ./logs/ue:/tmp
    depends_on:
      - ocudu-du
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.30
    command: srsue /config/ue.conf

  ue2:
    image: local/srsue:latest
    container_name: ue-srsue2
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config/ue/ue2.conf:/config/ue.conf:ro
      - ./logs/ue:/tmp
    depends_on:
      - ocudu-du
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.31
    command: srsue /config/ue.conf

  ue3:
    image: local/srsue:latest
    container_name: ue-srsue3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config/ue/ue3.conf:/config/ue.conf:ro
      - ./logs/ue:/tmp
    depends_on:
      - ocudu-du
    networks:
      oran_5g_net:
        ipv4_address: 10.0.0.32
    command: srsue /config/ue.conf

  # ===========================================================================
  # BLOQUE 4: NEAR-RT RIC
  # No se define aqui. Son los 7 contenedores de ./oran-sc-ric, con su propio
  # docker-compose.yml y su red 10.0.2.0/24. La CU-CP y la DU se conectan a esa
  # red (ric_net) para el interfaz E2.
  # ===========================================================================

  # ===========================================================================
  # BLOQUE 5: MODULO DE IA (pendiente de desarrollo)
  # Contenedor donde correra el modulo de deteccion de anomalias: leera las
  # metricas recogidas por la xApp desde ./data y generara las alertas.
  # Descomentar cuando exista el codigo en ./xapp_ai.
  # ===========================================================================
  # xapp-ai-monitor:
  #   build: ./xapp_ai
  #   container_name: xapp-ai-monitor
  #   volumes:
  #     - ./logs:/app/logs
  #     - ./data:/app/data
  #   networks:
  #     oran_5g_net:
  #       ipv4_address: 10.0.0.50

networks:
  oran_5g_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24

  # Red dedicada al trafico F1-U entre CU-UP y DU. Necesaria porque N3 y F1-U
  # comparten el puerto 2152 (GTP-U) y no pueden convivir en la misma IP.
  f1u_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

  # Red del Near-RT RIC, creada por el docker-compose de oran-sc-ric.
  # Externa: este fichero se conecta a ella, no la crea. Implica que el RIC
  # debe estar levantado ANTES que la CU-CP y la DU.
  ric_net:
    external: true
    name: oran-sc-ric_ric_network

volumes:
  mongo_data:
